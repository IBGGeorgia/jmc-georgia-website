name: JMC — temporary PRO official-photo identity inspection
on:
  push:
    branches: [feature/homepage-lineup-studio-v39]
    paths: ['.github/workflows/pro-source-inspection-v39.yml']
permissions: {contents: read}
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch JMC Georgia's own source photography
        shell: bash
        run: |
          mkdir -p vehicle-source
          curl --fail --location --retry 3 --max-time 50 'https://jmc-georgia.onrender.com/images/grand-avenue-pro/hero.jpg' -o vehicle-source/pro-hero.jpg
          curl --fail --location --retry 3 --max-time 50 'https://jmc-georgia.onrender.com/images/grand-avenue-pro/front-detail.jpg' -o vehicle-source/pro-front-detail.jpg
          file vehicle-source/*
      - uses: actions/upload-artifact@v4
        with:
          name: jmc-pro-original-identity
          path: vehicle-source
          retention-days: 2
