name: JMC — Secure CMS bootstrap integration
on:
  push:
    branches: [feature/jmc-cms-secure-setup-20261030, fix/cms-setup-submit-validation-20261030]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'db/**'
      - 'tests/e2e/cms-setup.spec.ts'
      - '.github/workflows/cms-setup-qa.yml'
permissions:
  contents: read
jobs:
  bootstrap-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jmc_test
          POSTGRES_PASSWORD: jmc_test
          POSTGRES_DB: jmc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jmc_test -d jmc_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://jmc_test:jmc_test@127.0.0.1:5432/jmc_test
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      CMS_SETUP_ENABLED: "true"
      CMS_SETUP_E2E: "1"
      TEST_DRIVE_ENABLED: "false"
      PRIVACY_POLICY_APPROVED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate temporary secrets without printing them
        shell: bash
        run: |
          {
            echo "LEAD_HASH_SECRET=$(openssl rand -hex 32)"
            echo "CMS_SESSION_SECRET=$(openssl rand -hex 32)"
            echo "CMS_SETUP_TOKEN=$(openssl rand -hex 48)"
            echo "CMS_E2E_ADMIN_PASSWORD=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test tests/e2e/cms-setup.spec.ts --workers=1
