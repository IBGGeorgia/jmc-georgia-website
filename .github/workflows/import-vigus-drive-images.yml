name: JMC — Import regenerated VIGUS Drive Studio images
on:
  push:
    branches: [feature/jmc-test-drive-bible-v21-20261030]
    paths:
      - 'scripts/import-vigus-drive-images.mjs'
      - '.github/workflows/import-vigus-drive-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-photos:
    if: github.ref == 'refs/heads/feature/jmc-test-drive-bible-v21-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download and validate two AI background-edit candidates
        run: node scripts/import-vigus-drive-images.mjs
      - name: Commit first-party assets to the candidate branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/vigus/drive-front-20261030.png public/images/vigus/drive-side-20261030.png
          git diff --cached --quiet || (git commit -m "Import two VIGUS background-edit photo candidates as local assets" && git push origin HEAD:feature/jmc-test-drive-bible-v21-20261030)
