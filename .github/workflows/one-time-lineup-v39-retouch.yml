name: JMC — One-time Model Lineup 3.9 final retouch
on:
  push:
    branches: [feature/homepage-lineup-studio-v39]
    paths: ['.github/workflows/one-time-lineup-v39-retouch.yml']
permissions: {contents: write}
jobs:
  retouch:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/homepage-lineup-studio-v39
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: LINEUP_MASTER_IMPORT=1 node scripts/master-homepage-lineup-v39.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: jmc-lineup-v39-retouch-review
          path: |
            public/images/homepage/lineup-vigus.webp
            public/images/homepage/lineup-grand-avenue.webp
            public/images/homepage/lineup-grand-avenue-pro.webp
            public/images/homepage/lineup-master-report.json
          retention-days: 4
      - name: Pin vetted media and checksum lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/images/homepage/lineup-vigus.webp public/images/homepage/lineup-grand-avenue.webp public/images/homepage/lineup-grand-avenue-pro.webp public/images/homepage/lineup-master-report.json assets/homepage/media-lock.json
          git commit -m 'Refresh unified studio images with model identity corrections'
          git push origin HEAD:feature/homepage-lineup-studio-v39
