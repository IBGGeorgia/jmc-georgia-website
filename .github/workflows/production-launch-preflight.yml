name: JMC — Production launch preflight (read-only)

on:
  # Read-only follow-up after the daily retention job scheduled 03:00 UTC.
  # GitHub Actions scheduled jobs can be delayed; this is observability, not
  # the mechanism that unlocks customer intake.
  schedule:
    - cron: '15 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-launch-preflight.yml'
      - 'scripts/jmc-production-launch-preflight.mjs'
      - 'app/privacy/**'
      - 'app/test-drive/**'
      - 'lib/test-drive-server.ts'
      - 'lib/privacy-policy.ts'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/jmc-production-launch-preflight.mjs'
      - '.github/workflows/production-launch-preflight.yml'
      - 'package.json'
  workflow_dispatch:
    inputs:
      require_ready:
        description: 'Require that public Test Drive intake is fully active (fails when approvals are outstanding)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  production-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      JMC_PREFLIGHT_REQUIRE_READY: ${{ (github.event_name == 'schedule' || inputs.require_ready == true) && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check actual JMC Production without writing customer data
        run: npm run qa:launch:live
