name: JMC — One-time Model Lineup 3.9 master

on:
  push:
    branches:
      - feature/homepage-lineup-studio-v39
    paths:
      - '.github/workflows/one-time-lineup-v39.yml'

permissions:
  contents: write

jobs:
  master-approved-lineup:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/homepage-lineup-studio-v39
          persist-credentials: true
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install
      - name: Master approved source images
        run: LINEUP_MASTER_IMPORT=1 node scripts/master-homepage-lineup-v39.mjs
      - name: Upload candidate trio for manual visual QA
        uses: actions/upload-artifact@v4
        with:
          name: jmc-lineup-v39-photo-review
          path: |
            public/images/homepage/lineup-vigus.webp
            public/images/homepage/lineup-grand-avenue.webp
            public/images/homepage/lineup-grand-avenue-pro.webp
            public/images/homepage/lineup-master-report.json
          retention-days: 7
      - name: Commit first-party master images with SHA-256 lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/images/homepage/lineup-vigus.webp public/images/homepage/lineup-grand-avenue.webp public/images/homepage/lineup-grand-avenue-pro.webp public/images/homepage/lineup-master-report.json assets/homepage/media-lock.json
          git diff --cached --stat
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Pin unified three-model Homepage studio imagery in Git'
          git push origin HEAD:feature/homepage-lineup-studio-v39
