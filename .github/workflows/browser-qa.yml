name: JMC — Browser QA

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/browser-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/browser-qa.yml'
  workflow_dispatch:

concurrency:
  group: jmc-browser-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-qa:
    name: Chromium / responsive and interaction checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install project dependencies
        run: npm install
      - name: Install browser and runtime dependencies
        run: npx playwright install --with-deps chromium
      - name: Build production app
        run: npm run build
      - name: Browser QA
        run: npm run qa:browser
      - name: Upload browser report, traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmc-browser-qa
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
