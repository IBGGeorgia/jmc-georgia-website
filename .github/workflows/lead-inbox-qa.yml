name: JMC — Lead Inbox PostgreSQL integration
on:
  push:
    branches: [feature/cms-lead-operations-v2-20261030, feature/jmc-production-readiness-diagnostics-20261030, feature/jmc-marketing-consent-withdrawal-20261030]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'tests/e2e/lead-inbox-integration.spec.ts'
      - '.github/workflows/lead-inbox-qa.yml'
  pull_request:
    paths:
      - 'app/api/lead-manager/**'
      - 'app/lead-manager/**'
      - 'app/admin/settings/page.tsx'
      - 'tests/e2e/lead-inbox-integration.spec.ts'
      - '.github/workflows/lead-inbox-qa.yml'
permissions:
  contents: read
jobs:
  lead-inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jmc_test
          POSTGRES_PASSWORD: jmc_test
          POSTGRES_DB: jmc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jmc_test -d jmc_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://jmc_test:jmc_test@127.0.0.1:5432/jmc_test
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      CMS_LEAD_E2E: "1"
      TEST_DRIVE_ENABLED: "false"
      PRIVACY_POLICY_APPROVED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Ephemeral CI secrets
        shell: bash
        run: |
          {
            echo "LEAD_HASH_SECRET=$(openssl rand -hex 32)"
            echo "CMS_SESSION_SECRET=$(openssl rand -hex 32)"
            echo "CMS_BOOTSTRAP_USERNAME=qa-owner"
            echo "CMS_BOOTSTRAP_DISPLAY_NAME=QA Administrator"
            echo "CMS_BOOTSTRAP_PASSWORD=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      - run: npm install
      - run: npm run db:migrate:leads
      - run: npm run cms:admin:create
      - name: Seed 32 synthetic CI leads (never production)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const pool=new pg.Pool({connectionString:process.env.DATABASE_URL});
          try{
            const r=await pool.query(`
              INSERT INTO jmc_test_drive_leads
               (id,full_name,phone,model_slug,status,consent_version,ip_fingerprint,created_at)
              SELECT gen_random_uuid(), 'QA Lead '||g,
               '+9955'||lpad(g::text,8,'0'),
               CASE WHEN g%3=0 THEN 'vigus' ELSE 'grand-avenue' END,
               CASE WHEN g%2=0 THEN 'new' ELSE 'contacted' END,
               'qa-only',repeat('f',64),now()-make_interval(mins=>g)
              FROM generate_series(1,32) AS g`);
            if(r.rowCount!==32)throw Error('Expected 32 synthetic rows');
          }finally{await pool.end()}
          NODE
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test tests/e2e/lead-inbox-integration.spec.ts --workers=1
