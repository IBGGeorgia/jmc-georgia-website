name: JMC — Test Drive full journey QA
on:
  push:
    branches: [main, feature/test-drive-operational-readiness-20261030, feature/retention-secure-bridge-20261030]
    paths:
      - 'app/test-drive/**'
      - 'app/api/test-drive/**'
      - 'lib/test-drive-server.ts'
      - 'lib/retention-bridge.ts'
      - 'app/api/internal/retention/**'
      - 'scripts/render-retention-cron.mjs'
      - 'tests/e2e/test-drive-full-journey.spec.ts'
      - '.github/workflows/test-drive-journey-qa.yml'
  pull_request:
    paths:
      - 'app/test-drive/**'
      - 'app/api/test-drive/**'
      - 'app/admin/settings/page.tsx'
      - 'lib/test-drive-server.ts'
      - 'lib/retention-bridge.ts'
      - 'app/api/internal/retention/**'
      - 'scripts/render-retention-cron.mjs'
      - 'db/test-drive.sql'
      - 'lib/cms-schema.ts'
      - 'scripts/purge-expired-leads.mjs'
      - 'tests/e2e/test-drive-full-journey.spec.ts'
      - '.github/workflows/test-drive-journey-qa.yml'
permissions:
  contents: read
jobs:
  test-drive-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jmc_test
          POSTGRES_PASSWORD: jmc_test
          POSTGRES_DB: jmc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jmc_test -d jmc_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://jmc_test:jmc_test@127.0.0.1:5432/jmc_test
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      TEST_DRIVE_E2E: "1"
      TEST_DRIVE_ENABLED: "true"
      PRIVACY_POLICY_APPROVED: "true"
      PRIVACY_POLICY_VERSION: "ci-test-only"
      RETENTION_HTTP_EXECUTION_ENABLED: "true"
      RETENTION_SCHEDULE_CONFIRMED: "true"
      JMC_RETENTION_EXECUTION_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate temporary secrets only for disposable CI database
        shell: bash
        run: |
          {
            echo "LEAD_HASH_SECRET=$(openssl rand -hex 32)"
            echo "CMS_SESSION_SECRET=$(openssl rand -hex 32)"
            echo "JMC_RETENTION_BRIDGE_TOKEN=$(openssl rand -hex 48)"
          } >> "$GITHUB_ENV"
      - run: npm install
      - run: npm run db:migrate:leads
      - name: Run actual retention cleanup on disposable CI database
        run: npm run db:retention:leads -- --execute
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test tests/e2e/test-drive-full-journey.spec.ts --workers=1
