name: Import approved JMC Studio assets
on:
  push:
    branches: [feature/approved-studio-images-20261030]
    paths:
      - '.github/workflows/import-approved-studio.yml'
jobs:
  import-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import and validate approved photos
        env:
          ARCHIVE_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_39RQYoSaWBG5Rv9RmVqvLICsOMX/fe2a5fc0-d4ed-49eb-bc57-1a70b558c8ec.zip
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error "$ARCHIVE_URL" -o /tmp/jmc-approved-studio.zip
          unzip -q /tmp/jmc-approved-studio.zip 'public/images/studio/*.webp'
          python3 - <<'PY'
          from pathlib import Path
          for n in ('vigus','grand-avenue','grand-avenue-pro'):
              p=Path(f'public/images/studio/{n}-studio.webp')
              raw=p.read_bytes()
              assert len(raw)>20000 and raw[:4]==b'RIFF' and raw[8:12]==b'WEBP',(p,len(raw))
              print(p,len(raw))
          PY
      - name: Commit approved original binaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/studio/*.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Add user-approved Studio WebP assets'
            git push origin HEAD:feature/approved-studio-images-20261030
          fi
